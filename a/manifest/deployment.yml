apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-alpha-ms
  namespace: milton
spec:
  selector:
    matchLabels:
      app: stream-alpha-ms
  replicas: 1
  template:
    metadata:
      labels:
        app: stream-alpha-ms
    spec:
      containers:
        - name: stream-alpha-ms
          image: milton-stream-alpha-ms-img
          imagePullPolicy: Never  	# another option is IfNotPresent
          ports:
            - containerPort: 8080
