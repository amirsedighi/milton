spring.application.name=beta-ms

tracing.url=http://jaeger-all-in-one.default:14250

# logging.level.root=INFO
logging.level.io.micrometer=DEBUG

spring.main.allow-circular-references=true

# Actuator
management.endpoint.beans.enabled=true
management.tracing.enabled= true
management.tracing.sampling.probability= 1.0
management.endpoints.web.exposure.include=*
# management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Kafka
spring.kafka.bootstrap-servers = my-cluster-kafka-bootstrap.kafka:9092
spring.kafka.consumer.auto-offset-reset = earliest
spring.kafka.consumer.group-id = alpha-beta-group-id-1000
spring.kafka.topic=milton-alpha-beta

logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

gamma.url=http://stream-gamma-ms-svc.milton:8080

