apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-command-ms
  namespace: milton
spec:
  replicas: 1
  selector:
    matchLabels:
      app: express-command-ms
  template:
    metadata:
      labels:
        app: express-command-ms
    spec:
      hostAliases:
        - ip: "192.168.65.254"
          hostnames:
            - "host.minikube.internal"
      containers:
        - name: express-command-ms
          image: milton-express-command-ms-img
          imagePullPolicy: Never  	# another option is IfNotPresent
          ports:
            - containerPort: 5701
            - containerPort: 8080
          resources:
            requests:
              memory: "2000Mi"
              cpu: "3000m"
            limits:
              memory: "2000Mi"
              cpu: "3000m"
