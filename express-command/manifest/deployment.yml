apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-command-ms
  namespace: milton
spec:
  replicas: 1
  selector:
    matchLabels:
      app: express-command-ms
  template:
    metadata:
      labels:
        app: express-command-ms
    spec:
      hostAliases:
        - ip: "192.168.65.254"
          hostnames:
            - "host.minikube.internal"
      containers:
        - name: express-command-ms
          env:
            - name: JAVA_OPTS
#              value: "-Xms1200M -Xmx1200M -Dhazelcast.operation.responsequeue.idlestrategy=backoff -Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Dcom.sun.management.jmxremote.local.only=false -Dcom.sun.management.jmxremote.port=9999 -Dcom.sun.management.jmxremote.rmi.port=9999 -Djava.rmi.server.hostname=127.0.0.1"
              value: "-Xms1800M -Xmx1800M -Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Dcom.sun.management.jmxremote.local.only=false -Dcom.sun.management.jmxremote.port=9999 -Dcom.sun.management.jmxremote.rmi.port=9999 -Djava.rmi.server.hostname=127.0.0.1"
          image: milton-express-command-ms-img
          imagePullPolicy: Never  	# another option is IfNotPresent
          ports:
            - containerPort: 5701
            - containerPort: 8080
          resources:
            requests:
              memory: "2000Mi"
              cpu: "3000m"
            limits:
              memory: "2000Mi"
              cpu: "3000m"

#            requests:
#              memory: "1400Mi"
#              cpu: "2400m"
#            limits:
#              memory: "1400Mi"
#              cpu: "2400m"
