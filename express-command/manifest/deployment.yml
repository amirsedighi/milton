apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-command
  namespace: milton
spec:
  selector:
    matchLabels:
      app: express-command-ms
  replicas: 1
  template:
    metadata:
      labels:
        app: express-command-ms
    spec:
      hostAliases:
        - ip: "192.168.65.254"
          hostnames:
            - "host.minikube.internal"
      containers:
        - name: express-command-ms
          image: milton-express-command-ms-img
          imagePullPolicy: Never  	# another option is IfNotPresent
          ports:
            - containerPort: 8080
            - name: multicast
              containerPort: 5701
